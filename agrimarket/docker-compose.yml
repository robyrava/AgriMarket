version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: agrimarket-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=agrimarket
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=agrimarket_default
    volumes:
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrimarket"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: agrimarket-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=agrimarket
      - RABBITMQ_DEFAULT_PASS=secret
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: agrimarket-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - postgres
      - rabbitmq

volumes:
  postgres-data:
