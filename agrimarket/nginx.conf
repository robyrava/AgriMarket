events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        location /api/v1/catalog {
            rewrite ^/api/v1/catalog(.*)$ /api/catalog$1 break;
            proxy_pass http://catalog-service:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/orders {
            rewrite ^/api/v1/orders(.*)$ /api/orders$1 break;
            proxy_pass http://order-service:8082;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/notifications {
            rewrite ^/api/v1/notifications(.*)$ /api/notifications$1 break;
            proxy_pass http://notification-service:8083;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
